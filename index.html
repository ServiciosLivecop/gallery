<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Activos Digitales</title>
    <style>
        :root {
            --fondo: #0d1117;
            --tarjeta: #161b22;
            --borde: #30363d;
            --azul: #58a6ff;
            --texto: #c9d1d9;
        }

        body {
            background-color: var(--fondo);
            color: var(--texto);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 40px 20px;
        }

        /* Contenedor que organiza todo automáticamente */
        .galeria-grid {
            display: grid;
            /* Esto hace que se pongan uno al lado del otro automáticamente */
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .item-foto {
            background: var(--tarjeta);
            border: 1px solid var(--borde);
            border-radius: 12px;
            padding: 15px;
            transition: 0.3s;
        }

        .item-foto:hover { border-color: var(--azul); }

        /* Cuadrícula para ver transparencia PNG */
        .visor {
            height: 180px;
            background-image: linear-gradient(45deg, #21262d 25%, transparent 25%), linear-gradient(-45deg, #21262d 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #21262d 75%), linear-gradient(-45deg, transparent 75%, #21262d 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px; margin-bottom: 12px;
        }

        img { max-width: 90%; max-height: 90%; object-fit: contain; }

        .input-link {
            width: 100%; background: #010409; border: 1px solid var(--borde);
            color: #8b949e; padding: 8px; font-size: 11px; border-radius: 5px;
            box-sizing: border-box; font-family: monospace; cursor: pointer;
        }

        .btn-copiar {
            width: 100%; background: #238636; color: white; border: none;
            padding: 10px; margin-top: 10px; border-radius: 6px;
            font-weight: bold; cursor: pointer;
        }

        .btn-copiar:active { background: #2ea043; }
    </style>
</head>
<body>

    <h2 style="text-align: center; margin-bottom: 40px; color: var(--azul);">Mis Activos Digitales</h2>

    <div class="galeria-grid">
        
        <div class="item-foto">
            <div class="visor"><img src="DECOM.png"></div>
            <input type="text" class="input-link" value="?" readonly onclick="this.select()">
            <button class="btn-copiar" onclick="copiar(this)">COPIAR ENLACE</button>
        </div>
        <div class="item-foto">
            <div class="visor"><img src="ipuc.webp"></div>
            <input type="text" class="input-link" value="?" readonly onclick="this.select()">
            <button class="btn-copiar" onclick="copiar(this)">COPIAR ENLACE</button>
        </div>

        </div>

    <script>
        function copiar(btn) {
            const input = btn.previousElementSibling;
            input.select();
            document.execCommand('copy');
            const textoOriginal = btn.innerText;
            btn.innerText = "¡COPIADO!";
            setTimeout(() => { btn.innerText = textoOriginal; }, 2000);
        }
    </script>

</body>
</html>
